<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>O-week Section Wars Co26 Scoreboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --accent: #4895ef;
      --background: #f8f9fa;
      --text: #212529;
      --light-gray: #e9ecef;
      --medium-gray: #ced4da;
      --dark-gray: #6c757d;
      --success: #06d6a0;
      --warning: #ffd166;
      --danger: #ef476f;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: var(--background);
      color: var(--text);
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
    }
    .scoreboard-section {
      margin-bottom: 40px;
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    /* Chart container styling */
    .chart-container {
      position: relative;
      height: 350px;
      margin-bottom: 20px;
    }
    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--light-gray);
    }
    th {
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    tr:nth-child(even) {
      background-color: var(--light-gray);
    }
    tr:hover {
      background-color: rgba(67, 97, 238, 0.1);
    }
    /* Medal colors */
    .gold {
      background-color: #FFD700;
      color: black;
      border-radius: 3px;
      padding: 3px 8px;
      font-weight: bold;
    }
    .silver {
      background-color: #C0C0C0;
      color: black;
      border-radius: 3px;
      padding: 3px 8px;
      font-weight: bold;
    }
    .bronze {
      background-color: #CD7F32;
      color: white;
      border-radius: 3px;
      padding: 3px 8px;
      font-weight: bold;
    }
    .team-color {
      display: inline-block;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      margin-right: 8px;
    }
    /* Assign some distinct colors to each new team name */
    .team-Alligators { background-color: #FF6384; }
    .team-Bobcats { background-color: #36A2EB; }
    .team-Cheetahs { background-color: #FFCE56; }
    .team-Dragons { background-color: #4BC0C0; }
    .team-Eagles { background-color: #9966FF; }
    .team-Foxes { background-color: #FF9F40; }
    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      background-color: var(--dark-gray);
      color: white;
      border-radius: 10px;
    }
    /* Admin access button styling */
    .admin-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    .admin-button:hover {
      background-color: var(--secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <!-- 1) New Title -->
      <h1>O-week Section Wars Co26 Scoreboard</h1>
      <!-- 2) Subheading removed -->
    </header>
    
    <!-- 3) New scoreboard section for displaying current rank BEFORE overall standings -->
    <div class="scoreboard-section">
      <h2>Current Team Ranks</h2>
      <table id="rank-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
          <!-- Will be populated dynamically -->
        </tbody>
      </table>
    </div>
    
    <div class="scoreboard-section">
      <h2>Overall Team Standings</h2>
      <div class="chart-container">
        <canvas id="overallScores"></canvas>
      </div>
    </div>
    
    <!-- 5) Completed Events section is now empty (no sample data). Also date column removed. -->
    <div class="scoreboard-section">
      <h2>Completed Events Results</h2>
      <table id="results-table">
        <thead>
          <tr>
            <th>Event</th>
            <th>1st Place</th>
            <th>2nd Place</th>
            <th>3rd Place</th>
          </tr>
        </thead>
        <tbody>
          <!-- Initially empty; admins will add via admin page. -->
        </tbody>
      </table>
    </div>
    
    <!-- 6 & 7) Updated upcoming events (no date/time columns), using provided info -->
    <div class="scoreboard-section">
      <h2>Upcoming Events Schedule & Points</h2>
      <table id="schedule-table">
        <thead>
          <tr>
            <th>Event Name</th>
            <th>1st Place Points</th>
            <th>2nd Place Points</th>
            <th>3rd Place Points</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated from your attached event info -->
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    <p>Championship Scoreboard System &copy; 2025</p>
    <!-- Button to access the hidden admin page (or wherever you placed admin controls) -->
    <button class="admin-button" onclick="window.location.href='admin.html'">Admin Login</button>
  </footer>

  <script>
    // 4) New team names
    const teamNames = [
      'Alligators',
      'Bobcats',
      'Cheetahs',
      'Dragons',
      'Eagles',
      'Foxes'
    ];
    // Example random scores for demonstration (0 to 100)
    let scores = teamNames.map(() => Math.floor(Math.random() * 101));

    // Team color mapping
    const teamColors = [
      'rgba(255, 99, 132, 0.8)',   // Alligators
      'rgba(54, 162, 235, 0.8)',  // Bobcats
      'rgba(255, 206, 86, 0.8)',  // Cheetahs
      'rgba(75, 192, 192, 0.8)',  // Dragons
      'rgba(153, 102, 255, 0.8)', // Eagles
      'rgba(255, 159, 64, 0.8)'   // Foxes
    ];

    // Create bar chart for overall scores
    const ctx = document.getElementById('overallScores').getContext('2d');
    let scoresChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: teamNames,
        datasets: [{
          label: 'Total Points',
          data: scores,
          backgroundColor: teamColors,
          borderColor: teamColors.map(c => c.replace('0.8', '1')),
          borderWidth: 1
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return `${context.parsed.x} points`;
              }
            }
          }
        },
        scales: {
          x: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Total Points',
              font: { size: 16 }
            }
          },
          y: {
            title: {
              display: true,
              text: 'Teams',
              font: { size: 16 }
            }
          }
        }
      }
    });

    // 5) Completed events array is empty (you will add them via admin page)
    const completedEvents = [];

    // Populate completed events table (starts empty)
    function updateCompletedEventsTable() {
      const tableBody = document.querySelector('#results-table tbody');
      tableBody.innerHTML = '';
      completedEvents.forEach(ev => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${ev.event}</td>
          <td><span class="team-color team-${ev.first}"></span><span class="gold">${ev.first}</span></td>
          <td><span class="team-color team-${ev.second}"></span><span class="silver">${ev.second}</span></td>
          <td><span class="team-color team-${ev.third}"></span><span class="bronze">${ev.third}</span></td>
        `;
        tableBody.appendChild(row);
      });
    }

    // 7) Replace old upcoming events with your new set (no date/time columns)
    const upcomingEvents = [
      { name: "LCA",                   first: 300, second: 200, third: 100 },
      { name: "Section Carnival Stalls",first: 300, second: 200, third: 100 },
      { name: "Shark Sank",            first: 300, second: 200, third: 100 },
      { name: "Football",              first: 250, second: 150, third: 100 },
      { name: "Frisbee",               first: 250, second: 150, third: 100 },
      { name: "Handball",              first: 250, second: 150, third: 100 },
      { name: "Meme Wars",             first: 200, second: 150, third: 100 },
      { name: "Canvas Painting",       first: 200, second: 150, third: 100 },
      { name: "Case Comp - Prod",      first: 200, second: 100, third: 50 },
      { name: "Case Comp - Fin",       first: 200, second: 100, third: 50 },
      { name: "Case Comp - Mktg",      first: 200, second: 100, third: 50 },
      { name: "Pass the Talent Baton", first: 150, second: 100, third: 50 },
      { name: "Photography Contest",   first: 150, second: 100, third: 50 }
    ];

    // Populate upcoming events table
    function populateScheduleTable() {
      const tableBody = document.querySelector('#schedule-table tbody');
      tableBody.innerHTML = '';
      upcomingEvents.forEach(ev => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${ev.name}</td>
          <td>${ev.first}</td>
          <td>${ev.second}</td>
          <td>${ev.third}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // New: Display a rank table based on current scores
    function updateRankTable() {
      // Pair each team with its score
      const teamScorePairs = teamNames.map((name, i) => ({ name, score: scores[i] }));
      // Sort descending by score
      teamScorePairs.sort((a, b) => b.score - a.score);

      const rankBody = document.querySelector('#rank-table tbody');
      rankBody.innerHTML = '';

      teamScorePairs.forEach((pair, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${pair.name}</td>
          <td>${pair.score}</td>
        `;
        rankBody.appendChild(row);
      });
    }

    // On page load:
    updateRankTable();
    updateCompletedEventsTable();
    populateScheduleTable();
  </script>
</body>
</html>
